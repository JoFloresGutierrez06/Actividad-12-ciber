name: "Main / Pull requests build"
on:
  pull_request:
    paths-ignore:
      - '.txt'
      - 'LICENSE'
      - 'docs/**'
    branches: [ main ]
  push:
    branches:
      - main

jobs:
  pre-commit:
    name: Pre-commit check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Setup Java
        uses: ./.github/actions/java-setup
        with:
          cache: ""

      - name: Pre-commit checks
        uses: pre-commit/action@v3.0.1

      - name: pre-commit-c-lite
        uses: pre-commit-ci/lite-action@v1.2.0
        if: always()

  build:
    runs-on: ${{ matrix.os }}
    needs: [ pre-commit ]
    strategy:
      fail-fast: true
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-15-intel ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: ./.github/actions/java-setup
        with:
          cache: 'maven'

      - name: Cache SonarQube packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        run: mvn --no-transfer-progress verify

      - name: SonarQube Scan
        if: matrix.os == 'ubuntu-latest'
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jofloresgutierrez06
            -Dsonar.projectKey=JoFloresGutierrez06_Actividad-12-ciber
